[tool.poetry]
name = "jupyter-venv"
version = "0.1.0"
description = ""
authors = ["Tsvika <tsvika@>"]

[tool.poetry.dependencies]
python = "~3.11"
#scientific stack
pandas = {extras = ["clipboard", "computation", "excel", "html", "output-formatting", "performance", "plot", "xml"], version = "^2"}
scipy = "^1"
xarray = "^2023"
statsmodels = "^0.14"
networkx = "^3"
pillow = "^9"
scikit-image = "^0.21"
scikit-learn = "^1"
# jupyter
jupyter-collaboration = "^1"
jupyterlab = "^4"
jupytext = "^1"
xeus-python = "^0.15.8"
# jupyter export
pandoc = "^2.3"
# visualization
hvplot = "^0.8"
matplotlib = "^3"
seaborn = "^0.12"
datashader = "^0.15.0"
# interactive visualization
ipywidgets = "^8.0.6"
# tools
joblib = "^1"
icecream = "^2"
more-itertools = "^9"
tqdm = "^4"
# online
requests = "^2.31.0"
pooch = "^1.7.0"
openai = "^0.27.8"
# scraping
parsel = "^1.8.1"
numpy = "^1.24"


[tool.poetry.group.lsp.dependencies]
pyright = "^1.1.314"
python-language-server = "^0.36.2"
python-lsp-server = "^1.7.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
