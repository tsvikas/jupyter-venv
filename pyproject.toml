[tool.poetry]
package-mode = false
name = "jupyter-venv"
version = "0.1.0"
description = ""
authors = ["Tsvika <tsvika@>"]

[tool.poetry.dependencies]
python = "~3.12"
# scientific stack:
numpy = "^2"
pandas = {extras = ["clipboard", "computation", "excel", "html", "output_formatting", "plot", "xml"], version = "^2"}
scipy = "^1"
xarray = "*"
statsmodels = "*"
networkx = "*"
pillow = "*"
scikit-image = "*"
scikit-learn = "*"
pyarrow = ">=13"
einops = "*"
# jupyter:
jupyterlab = "^4"
jupytext = "^1"
# jupyter-collaboration = "^1"  # disabled, need to mature
# jupyter export:
pandoc = "*"
# visualization:
matplotlib = "^3"
hvplot = "*"
seaborn = "*"
# interactive visualization:
ipywidgets = "*"
# tools:
joblib = "*"
icecream = "*"
more-itertools = "*"
tqdm = "*"
# online:
requests = "*"
pooch = "*"
openai = "*"
# scraping:
parsel = "*"
phonenumbers = "*"
# resolve issues:
pyqt5-qt5 = "!=5.15.11,!=5.15.12,!=5.15.13,!=5.15.14"  # install issue with those versions
# more:

[tool.poetry.group.kernels.dependencies]
xeus-python = "*"
ipyflow = "*"  # experimental

[tool.poetry.group.lsp.dependencies]
pyright = "*"
python-lsp-server = "*"
# outdated:
# python-language-server = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
