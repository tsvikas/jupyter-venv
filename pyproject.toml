[project]
name = "jupyter-venv"
version = "0.1.0"
authors = [
    {name = "Tsvika", email = "tsvika@"},
]
description = ""
package-mode = false
requires-python = ">=3.13"
dependencies = [
    ## scientific stack:
    "einops",
    "geopy",
    "networkx",
    "numpy>=2",
    "pandas[clipboard,computation,excel,html,output_formatting,plot,xml]<3,>=2",
    "pillow",
    "polars[async,cloudpickle,excel,graph,numpy,pandas,plot,pyarrow,pydantic,style,timezone]",
    "pyarrow>=13",
    "scikit-image",
    "scikit-learn",
    "scipy>=1",
    "statsmodels",
    "xarray",
    ## jupyter:
    "ipython",
    "jupyterlab<5,>=4",
    "pandoc",
    "jupyterlab-code-formatter",
    "jupytext",
    # "jupyter-collaboration",  # too much logs
    ## formatters
    "isort",
    "black",
    ## visualization / interactive:
    "matplotlib",
    "hvplot",
    "seaborn",
    "altair[all]",
    "great-tables",
    "ipywidgets",
    "plotly",
    "ipydatagrid",
    ## tools:
    "joblib",
    "icecream",
    "more-itertools",
    "python-dotenv",
    "tqdm",
    "jsonlines",
    ## online/scraping:
    "requests",
    "openai",
    "pooch",
    "parsel",
    "phonenumbers",
    "yfinance",
    "yfinance-cache",
    ## more:
]


[dependency-groups]
dev = []
lsp = [
    "pyright",
    "python-lsp-server",
    # "python-language-server",  # outdated
]


[tool.uv]
default-groups = ["dev", "lsp"]
