[tool.poetry]
name = "jupyter-venv"
version = "0.1.0"
description = ""
authors = ["Tsvika <tsvika@>"]

[tool.poetry.dependencies]
python = "~3.11"
#scientific stack
numpy = "^1"
pandas = {extras = ["clipboard", "computation", "excel", "html", "output_formatting", "performance", "plot", "xml"], version = "^2"}
scipy = "^1"
xarray = "*"
statsmodels = "*"
networkx = "*"
pillow = "*"
scikit-image = "*"
scikit-learn = "*"
einops = "*"
# jupyter
jupyterlab = "^4"
jupytext = "^1"
xeus-python = "*"
# disabled because eit need to mature:
# jupyter-collaboration = "^1"
# jupyter export
pandoc = "*"
# visualization
matplotlib = "^3"
hvplot = "*"
seaborn = "*"
datashader = "*"
# interactive visualization
ipywidgets = "*"
# tools
joblib = "*"
icecream = "*"
more-itertools = "*"
tqdm = "*"
# online
requests = "*"
pooch = "*"
openai = "*"
# scraping
parsel = "*"
# more

[tool.poetry.group.lsp.dependencies]
pyright = "*"
python-lsp-server = "*"
# outdated:
# python-language-server = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
