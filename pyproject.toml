[project]
name = "jupyter-venv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    ## scientific stack:
    "einops",
    "geopy",
    "hepstats",
    "ibis-framework[duckdb,polars]",
    "networkx",
    "numba>=0.61",
    "numpy",
    "pandas[clipboard,computation,compression,consortium-standard,excel,feather,html,output-formatting,parquet,performance,plot,xml]>=2.1",
    "pillow",
    "polars[async,cloudpickle,excel,graph,numpy,pandas,plot,pyarrow,pydantic,style,timezone]",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "xarray",
    ## visualization / interactive:
    "altair[all]",
    "datashader",
    "great-tables",
    "hist[fit,plot]",
    "hvplot",
    "ipydatagrid",
    "ipywidgets",
    "matplotlib",
    "plotly",
    "seaborn",
    ## tools:
    "gitpython",
    "joblib",
    "jsonlines",
    "more-itertools",
    "pendulum",
    "psutil",
    "python-dotenv",
    "rich",
    "tqdm",
    ## online / scraping:
    "langchain[anthropic,google-genai,openai]",
    "openai",
    "parsel",
    "phonenumbers",
    "pooch",
    "requests",
    "yfinance",
    "yfinance-cache",
    ## debug /  profiling
    "icecream",
    "pysnooper",
    "scalene",
    ## misc
    "astral",
    ## unsorted:
    "sympy>=1.14.0",
    "tomli-w>=1.2.0",
]


[dependency-groups]
dev = []
jupyter = [
    "ipython",
    "jupyterlab~=4.0",
    "pandoc",
    "jupyterlab-code-formatter",
    "jupytext",
    # "jupyter-collaboration",  # too much logs
    "euporie",
    "nbconvert[webpdf]",
]
formatters = [
    "isort",
    "black",
]
lsp = [
    "pyright",
    "python-lsp-server",
    # "python-language-server",  # outdated
]


[tool.uv]
default-groups = ["dev", "jupyter", "formatters", "lsp"]
