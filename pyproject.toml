[project]
name = "jupyter-venv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    ## scientific stack:
    "einops",
    "geopy",
    "hepstats",
    "ibis-framework",
    "networkx",
    "numpy",
    "pandas[clipboard,computation,compression,consortium-standard,excel,html,output-formatting,performance,plot,xml]>=2.1",
    "pillow",
    "polars[async,cloudpickle,excel,graph,numpy,plot,pydantic,style,timezone]",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "sympy",
    "xarray",
    ## needed for python 3.14
    "numba>=0.63.0b1",
    "llvmlite>=0.46.0.dev0",
    ## visualization / interactive:
    "datashader",
    "great-tables",
    "hist[fit,plot]",
    "hvplot",
    "ipydatagrid",
    "ipywidgets",
    "matplotlib",
    "plotly",
    "seaborn",
    ## tools:
    "astral",
    "gitpython",
    "joblib",
    "jsonlines",
    "more-itertools",
    "pendulum",
    "psutil",
    "python-dotenv",
    "rich",
    "tomli-w",
    "tqdm",
    ## online / scraping:
    "langchain[anthropic,google-genai,openai]",
    "openai",
    "parsel",
    "phonenumbers",
    "pooch",
    "requests",
    "yfinance",
    "yfinance-cache",
    ## debug /  profiling
    "icecream",
    "pysnooper",
    "scalene",
    ## unsorted:
]


[dependency-groups]
dev = []
terminal = [
    "euporie",
    "ipython",
]
jupyter = [
    "ipympl",
    # "jupyter-ai[all]",  # errors
    # "jupyter-collaboration",  # too much logs
    "jupyterlab~=4.0",
    "jupyterlab-code-formatter",
    "jupyterlab-git",
    "jupyterlab-github",
    # "jupyterlab-latex",  # not used
    "jupyterlab-myst",
    "jupytext",
    "nbconvert[webpdf]",
    "pandoc",
]
formatters = [
    "isort",
    "black",
]
lsp = [
    "pyright",
    "python-lsp-server",
    # "python-language-server",  # outdated
]


[tool.uv]
default-groups = ["dev", "terminal", "jupyter", "formatters", "lsp"]
