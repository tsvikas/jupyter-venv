[tool.poetry]
package-mode = false
name = "jupyter-venv"
version = "0.1.0"
description = ""
authors = ["Tsvika <tsvika@>"]

[tool.poetry.dependencies]
python = "~3.12"
## scientific stack:
numpy = ">=2"
pandas = {extras = ["clipboard", "computation", "excel", "html", "output_formatting", "plot", "xml"], version = "^2"}
scipy = ">=1"
xarray = "*"
statsmodels = "*"
networkx = "*"
pillow = "*"
scikit-image = "*"
scikit-learn = "*"
pyarrow = ">=13"
einops = "*"
geopy = "*"
## jupyter:
jupyterlab = "^4"
pandoc = "*"  # to export
jupyterlab-code-formatter = "*"
# jupytext = "*"  # async error
# jupyter-collaboration = "*"  # too much logs
## formatters
isort = "*"
black = "*"
## visualization / interactive:
matplotlib = "*"
hvplot = "*"
seaborn = "*"
ipywidgets = "*"
plotly = "*"
ipydatagrid = "*"
## tools:
joblib = "*"
icecream = "*"
more-itertools = "*"
tqdm = "*"
jsonlines = "*"
## online/scraping:
requests = "*"
pooch = "*"
parsel = "*"
phonenumbers = "*"
yfinance = "*"
## more:

[tool.poetry.group.kernels.dependencies]
ipyflow = "*"  # experimental

[tool.poetry.group.lsp.dependencies]
pyright = "*"
python-lsp-server = "*"
## outdated:
# python-language-server = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
